name: Build Outlaw Android APK

on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate or Restore Persistent Signing Keystore
        run: |
          if [ ! -f android/app/outlaw.keystore ]; then
            keytool -genkey -v -keystore android/app/outlaw.keystore \
              -alias outlaw \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass outlaw123 \
              -keypass outlaw123 \
              -dname "CN=Outlaw Shop Systems, OU=Mobile, O=Outlaw, L=Helena, S=MT, C=US"
          fi

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APK with Persistent Key & VersionCode
        run: |
          cd android
          ./gradlew assembleDebug -PcustomVersionCode=${{ github.run_number }} --stacktrace --no-daemon

      - name: Copy APK to Output for Distribution
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OutlawShopSystems-v1.0.apk

      - name: Upload APK to Supabase Public Storage
        run: |
          echo "Uploading OutlawShopSystems-v1.0.apk to Supabase Storage..."
          HTTP_STATUS=$(curl -s -o /tmp/supabase_res.json -w "%{http_code}" -X POST "https://wlacgguhevtygqvckoen.supabase.co/storage/v1/object/apks/OutlawShopSystems.apk" \
            -H "apikey: sb_publishable_3Bh_pQwFwpSOvCbYyZjxyw_EstlwMfw" \
            -H "Authorization: Bearer sb_publishable_3Bh_pQwFwpSOvCbYyZjxyw_EstlwMfw" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@output/OutlawShopSystems-v1.0.apk")
          echo "Supabase HTTP response status: $HTTP_STATUS"
          cat /tmp/supabase_res.json || true
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Retrying via PUT upsert..."
            curl -s -X PUT "https://wlacgguhevtygqvckoen.supabase.co/storage/v1/object/apks/OutlawShopSystems.apk" \
              -H "apikey: sb_publishable_3Bh_pQwFwpSOvCbYyZjxyw_EstlwMfw" \
              -H "Authorization: Bearer sb_publishable_3Bh_pQwFwpSOvCbYyZjxyw_EstlwMfw" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@output/OutlawShopSystems-v1.0.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OutlawShopSystems-Android-APK
          path: output/OutlawShopSystems-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/arena') || github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: "Outlaw Shop Systems Android App (Latest APK)"
          body: |
            ### 📱 Outlaw Shop Systems Standalone Android APK

            Download and install the native Android `.apk` below:
            - **100% True Offline Field Operation**
            - **Seamless 1-Tap Updates (No uninstall required)**
            - **Fast local database with background Supabase cloud sync**

            **Installation Instructions:**
            1. Download `OutlawShopSystems-v1.0.apk` below on your Android phone or tablet.
            2. Tap the downloaded file and select **Install** / **Update**.
            3. Open **Outlaw Shop Systems** from your home screen!
          files: |
            output/OutlawShopSystems-v1.0.apk
